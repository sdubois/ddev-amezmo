name: amezmo

pre_install_actions:
  - |
    #ddev-description:Verify this is a configured DDEV project
    if [ ! -f "${DDEV_APPROOT}/.ddev/config.yaml" ]; then
      echo "ddev-amezmo must be installed inside a configured DDEV project. Run 'ddev config' first." >&2
      exit 1
    fi
    # The bundled PHAR is binary and cannot carry DDEV's generated-file marker.
    # Replace only these add-on-managed release assets during an upgrade.
    rm -f \
      "${DDEV_APPROOT}/.ddev/amezmo/bin/amezmo-cli.phar" \
      "${DDEV_APPROOT}/.ddev/amezmo/bin/amezmo-cli.phar.sha256"

project_files:
  - providers/amezmo-production.yaml
  - providers/amezmo-staging.yaml
  - amezmo/amezmo
  - amezmo/configure
  - amezmo/provider-template.yaml
  - amezmo/bin/amezmo-cli.phar
  - amezmo/bin/amezmo-cli.phar.sha256
  - amezmo/environments/production.env
  - amezmo/environments/staging.env
  - commands/host/amezmo

post_install_actions:
  - |
    #ddev-description:Show Amezmo setup instructions
    chmod +x amezmo/amezmo amezmo/configure commands/host/amezmo
    echo "ddev-amezmo installed. Run 'ddev amezmo configure' for guided API-assisted setup. Then restart DDEV and run 'ddev amezmo doctor <environment>'. You can also edit .ddev/amezmo/environments/*.env manually."

removal_actions:
  - |
    #ddev-description:Remove the bundled Amezmo CLI release asset
    rm -f amezmo/bin/amezmo-cli.phar amezmo/bin/amezmo-cli.phar.sha256

ddev_version_constraint: '>= v1.24.10'
