#ddev-generated
# Amezmo production provider. Pushes can overwrite remote data. Edit the matching environment profile
# under .ddev/amezmo/environments and remove its ddev-generated marker after
# customization so an add-on upgrade will not overwrite it.

info_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production info

auth_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production auth

db_pull_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production pull-db

files_import_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production pull-files

db_push_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production push-db

files_push_command:
  service: host
  command: |
    "${DDEV_APPROOT}/.ddev/amezmo/amezmo" --profile production push-files
